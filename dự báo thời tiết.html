  <title>Weather App Việt Nam</title>

      font-family: "Poppins", sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .weather-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.2);
      padding: 25px;
      width: 380px;
      text-align: center;
    }
    .weather-card h2 {
      color: #007bff;
      margin-bottom: 20px;
    }
    #weatherResult img {
      width: 100px;
      margin-top: 10px;
    }
  </style>
</head>

    </select>

    <button id="showWeather" class="btn btn-primary w-100 mb-3">Xem thời tiết</button>

    <div id="weatherResult"></div>
  </div>

  <script>
    const apiKey = "adb70a97b1db4e59a4fb00e075620baf"; 

    document.getElementById("showWeather").addEventListener("click", () => {
      const value = document.getElementById("provinceSelect").value;
      if (!value) {
        alert("Vui lòng chọn một tỉnh/thành phố!");
        return;
      }
      const [lat, lon] = value.split(",");
      getWeather(lat, lon);
    });

    function getWeather(lat, lon) {
      const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric&lang=vi`;
      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (data.cod !== 200) {2
            alert("Không tìm thấy dữ liệu thời tiết!");
            return;
          }
          displayWeather(data);
        })
        .catch(() => alert("Lỗi khi tải dữ liệu thời tiết!"));
    }

    function displayWeather(data) {
      const result = document.getElementById("weatherResult");
      result.innerHTML = `
        <h4>${data.name}, ${data.sys.country}</h4>
        <img src="https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png" alt="icon">
        <h5>${data.weather[0].description}</h5>
        <p><b>Nhiệt độ:</b> ${data.main.temp}°C</p>
        <p><b>Độ ẩm:</b> ${data.main.humidity}%</p>
        <p><b>Tốc độ gió:</b> ${data.wind.speed} m/s</p>
        <p><b>Nhiệt độ thấp nhất:</b> ${data.main.temp_min}°C</p>
        <p><b>Nhiệt độ cao nhất:</b> ${data.main.temp_max}°C</p>
      `;
    }
  </script>
</body>
</html>
